services:
  postgres:
    image: postgres:16-alpine
    container_name: pawcoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawcoach
      POSTGRES_PASSWORD: pawcoach
      POSTGRES_DB: pawcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawcoach -d pawcoach"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
